name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/report-runtime-deps.sh"
      - "cmd/**"
      - "internal/cmd/releasearchive/**"
      - "internal/releasearchive/**"
      - "internal/releasemanifest/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The provider links DuckDB through cgo, so no single runner can build every
  # platform: each archive is built, tested and packed on a runner of its own
  # platform. The list is internal/releasemanifest.Platforms, the platforms the
  # DuckDB driver links a prebuilt library for; the publish job checks the two
  # agree. A pull request builds a snapshot and publishes nothing.
  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-22.04, exe: '' }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm, exe: '' }
          - { os: darwin, arch: arm64, runner: macos-15, exe: '' }
          - { os: darwin, arch: amd64, runner: macos-15-intel, exe: '' }
          - { os: windows, arch: amd64, runner: windows-2025, exe: '.exe' }
    env:
      GOWORK: "off"
      CGO_ENABLED: "1"
      # The oldest macOS the Go toolchain itself supports; without it the C
      # parts target the runner's own macOS. Other systems ignore it.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Name the version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-SNAPSHOT-$(git rev-parse --short HEAD)"
          fi
          printf 'version=%s\nmodified=%s\n' "$version" "$(git log -1 --format=%ct)" >>"$GITHUB_OUTPUT"
      - name: Build the provider
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          go build -trimpath \
            -ldflags "-s -w -X github.com/stokaro/ptah-duckdb-plugin/internal/buildversion.linked=$VERSION" \
            -o "bin/ptah-plugin-duckdb${{ matrix.exe }}" ./cmd/ptah-plugin-duckdb
          go version -m "bin/ptah-plugin-duckdb${{ matrix.exe }}" | grep -E 'duckdb|provider-sdk|CGO_ENABLED|GOOS|GOARCH'
      - name: Report runtime dependencies
        run: scripts/report-runtime-deps.sh "bin/ptah-plugin-duckdb${{ matrix.exe }}" | tee -a "$GITHUB_STEP_SUMMARY"
      # The end-to-end tests start the binary this job built, the one the
      # archive carries, instead of building one with the race detector.
      - name: Test the built provider
        env:
          PTAH_DUCKDB_PROVIDER_BIN: ${{ github.workspace }}/bin/ptah-plugin-duckdb${{ matrix.exe }}
        run: go test -tags integration ./integration -run 'TestConformance|TestProvider' -count=1 -v -timeout 30m
      - name: Pack the archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MODIFIED: ${{ steps.version.outputs.modified }}
        run: |
          go run ./internal/cmd/releasearchive -version "$VERSION" -os "${{ matrix.os }}" -arch "${{ matrix.arch }}" \
            -executable "bin/ptah-plugin-duckdb${{ matrix.exe }}" -out dist -modified "$MODIFIED"
      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GOWORK: "off"
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Write the release documents and the checksums
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-SNAPSHOT-$(git rev-parse --short HEAD)"
          fi
          go run ./cmd/release-lines > dist/release-lines.json
          go run ./cmd/provider-manifest -version "$version" > dist/ptah-provider.json
          cd dist
          # ptah-provider.json names exactly the archives the build jobs wrote.
          diff <(jq -r '.artifacts[].archive' ptah-provider.json | sort) \
            <(ls ptah-plugin-duckdb_*.tar.gz ptah-plugin-duckdb_*.zip | sort)
          sha256sum ptah-plugin-duckdb_* release-lines.json ptah-provider.json | sort -k2 > checksums.txt
          # Five archives and two documents.
          test "$(wc -l < checksums.txt)" -eq 7
          sha256sum -c checksums.txt
          ls -l
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            ptah-plugin-duckdb_* release-lines.json ptah-provider.json checksums.txt
